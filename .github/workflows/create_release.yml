name: Create full release

on:
  push:
    branches:
      - main
      - develop

env:
  NUGET_SERVER: https://api.nuget.org/v3/index.json

jobs:
  runs-on: ubuntu-latest
  create-release:
    outputs:
      semver: ${{ steps.version_step.outputs.SemVer }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare .NET
        uses: ./.github/actions/prepare-dotnet
        with:
          dependency-config-path: '**/Directory.Packages.props'
          dotnet-version: '9.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.3.x'

      - name: Determine Version
        id: version_step
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          updateProjectFiles: true

      - name: Create Package
        run: dotnet pack --no-restore

      - name: Create GitHub release
        env:
          TAG: v${{ steps.version_step.outputs.SemVer }}
        run: |
          gh release create "${{ env.TAG }}" \
            --repo="${{ env.GITHUB_REPOSITORY }}" \
            --title="${{ env.GITHUB_REPOSITORY }} ${{ env.TAG }}" \
            --generate-notes

      - name: Push to GitHub release
        env:
          VERSION: ${{ steps.version_step.outputs.SemVer }}
        run: |
          gh release upload ./OpenElectricity.Sdk/bin/release/OpenElectricity.Sdk.Core.${{ env.VERSION }}.nupkg
          gh release upload ./OpenElectricity.Sdk/bin/release/OpenElectricity.Sdk.Core.${{ env.VERSION }}.snupkg

      - name: Push to NuGet
        env:
          VERSION: ${{ steps.version_step.outputs.SemVer }}
        run: |
          dotnet push \
            ./OpenElectricity.Sdk/bin/release/OpenElectricity.Sdk.Core.${{ env.VERSION }}.nupkg \
            -s ${{ env.NUGET_SERVER }} \
            -k ${{ secrets.NUGET_TOKEN }}
