name: Create full release

on:
  push:
    branches:
      - main
      - develop

jobs:
  create-full-release:
    steps:
      - Name: Pack Release
        id: pack-release
        uses: ./.github/workflows/_pack-release.yml

      - Name: Tag commit
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git tag v${{ steps.pack-release.outputs.semver }}
          git push origin --tags