name: Build and Test

on:
  pull_request:
    branches: 
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
  
    - name: Prepare .NET
      uses: ./.github/actions/prepare-dotnet
      with:
        dependency-config-path: '**/Directory.Packages.props'
        dotnet-version: '9.0.x'

    - name: Build
      run: dotnet build --no-restore
